name: Release artifacts
on:
  push:
    tags: ["v*"]
jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # A corpus built from an installed release is identified by prep.version
      # alone, so the tag must equal pyproject's version and must not be .dev.
      - run: python scripts/check_release_version.py
      - run: python -m pip install build scikit-build-core pybind11
      - run: python -m build --sdist --no-isolation
      - uses: actions/upload-artifact@v4
        with: {name: "sdist-${{ github.ref_name }}", path: "dist/*.tar.gz"}
